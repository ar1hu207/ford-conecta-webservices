services:
  postgres:
    image: postgres:16-alpine
    container_name: ford-conecta-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ford
      POSTGRES_PASSWORD: ford_secret
      POSTGRES_DB: ford_conecta
    ports:
      - "5432:5432"
    volumes:
      - ford_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ford -d ford_conecta"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ford_pgdata:
